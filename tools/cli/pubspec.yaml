name: flutter_clean_arch_scaffold
description: >
  Flutter Clean Architecture 프로젝트 스캐폴딩 CLI.
  `flutter_clean_arch init`으로 기존 Flutter 프로젝트에 domain/data/presentation/design 구조를 복제하고,
  `add feature`로 feature 파일을 생성합니다.
version: 0.1.0
homepage: https://github.com/betterafter/flutter-template
repository: https://github.com/betterafter/flutter-template
issue_tracker: https://github.com/betterafter/flutter-template/issues

environment:
  sdk: ^3.5.3

dependencies:
  args: ^2.6.0
  path: ^1.9.0
  yaml: ^3.1.3
  yaml_edit: ^2.2.1

executables:
  flutter_clean_arch: flutter_clean_arch

dev_dependencies:
  lints: ^5.0.0

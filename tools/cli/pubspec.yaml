name: flutter_clean_arch_scaffold
description: >
  Flutter Clean Architecture 스캐폴딩 CLI. `flutter_clean_arch init`으로
  domain/data/presentation/design 멀티 패키지 구조를 복제하고, `add feature`로
  entity·dto·mapper·usecase 파일을 생성합니다.
version: 0.1.2
homepage: https://github.com/betterafter/flutter-template
repository: https://github.com/betterafter/flutter-template
issue_tracker: https://github.com/betterafter/flutter-template/issues

environment:
  sdk: ^3.5.3

dependencies:
  args: ^2.6.0
  path: ^1.9.0
  yaml: ^3.1.3
  yaml_edit: ^2.2.1

executables:
  flutter_clean_arch: flutter_clean_arch

dev_dependencies:
  lints: ^5.0.0

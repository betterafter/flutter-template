name: flutter_clean_arch_scaffold
description: >
  Flutter Clean Architecture 스캐폴딩 CLI. `init`으로 멀티 패키지 구조와
  payment 예시 feature(entity·dto·mapper·datasource·usecase·UI)를 함께 생성하고,
  `add feature`로 새 feature를 추가합니다.
version: 0.1.3
homepage: https://github.com/betterafter/flutter-template
repository: https://github.com/betterafter/flutter-template
issue_tracker: https://github.com/betterafter/flutter-template/issues

environment:
  sdk: ^3.5.3

dependencies:
  args: ^2.6.0
  path: ^1.9.0
  yaml: ^3.1.3
  yaml_edit: ^2.2.1

executables:
  flutter_clean_arch: flutter_clean_arch

dev_dependencies:
  lints: ^5.0.0
